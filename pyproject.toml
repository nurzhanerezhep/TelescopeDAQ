[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telescopedaq"
version = "0.1.0"
description = "DAQ for a telescope using a CAEN DT5740D digitizer"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0", "awkward>=2.6", "uproot>=5.4",
  "pyyaml>=6.0", "matplotlib>=3.9", "rich>=13.9",
]

[tool.setuptools.packages.find]
include = ["telescopedaq*"]
