[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telescopedaq"
version = "0.3.0"
description = "DAQ for a telescope using a CAEN DT5740D digitizer"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0", "awkward>=2.6", "uproot>=5.4",
  "pyyaml>=6.0", "matplotlib>=3.9", "psutil>=6.0",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18",
]

[project.optional-dependencies]
test = ["httpx>=0.28", "playwright>=1.50"]

[tool.setuptools.package-data]
"telescopedaq.web" = ["static/*", "static/vendor/*"]

[tool.setuptools.packages.find]
include = ["telescopedaq*"]
